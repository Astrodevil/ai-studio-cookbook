<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><rect width="800" height="600" fill="#f8f9fa"/><text x="400" y="30" fill="#2c3e50" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">LLM Model Distillation Process</text><g id="teacher-section"><rect width="200" height="120" x="50" y="80" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="10"/><text x="150" y="105" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Teacher Model</text><text x="150" y="125" fill="#fff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">(Large LLM)</text><text x="150" y="145" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• High Performance</text><text x="150" y="160" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Large Parameters</text><text x="150" y="175" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Slow Inference</text><text x="150" y="190" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• High Memory Usage</text></g><rect width="200" height="60" x="50" y="220" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/><text x="150" y="240" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Training Data</text><text x="150" y="255" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">&quot;What is the capital of France?&quot;</text><text x="150" y="270" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">&quot;Explain quantum computing&quot;</text><path fill="none" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)" d="M 150 220 L 150 200"/><rect width="160" height="120" x="300" y="80" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="5"/><text x="380" y="105" fill="#27ae60" font-family="Arial, sans-serif" font-