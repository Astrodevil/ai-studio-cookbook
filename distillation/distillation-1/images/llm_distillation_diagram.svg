="Arial, sans-serif" font-size="10" text-anchor="middle">Learned Distribution</text><text x="380" y="415" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">Paris: 0.82</text><text x="380" y="428" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">London: 0.07</text><text x="380" y="441" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">Berlin: 0.04</text><text x="380" y="454" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">Others: 0.07</text><path fill="none" stroke="#fdcb6e" stroke-width="2" marker-end="url(#arrowhead)" d="M 250 410 L 300 410"/><rect width="220" height="140" x="520" y="250" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="10"/><text x="630" y="275" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Distillation Loss</text><rect width="90" height="40" x="530" y="285" fill="#f39c12" stroke="#e67e22" stroke-width="1" rx="5"/><text x="575" y="300" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Hard Loss</text><text x="575" y="315" fill="#fff" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">(True Labels)</text><rect width="90" height="40" x="630" y="285" fill="#16a085" stroke="#1abc9c" stroke-width="1" rx="5"/><text x="675" y="300" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Soft Loss</text><text x="675" y="315" fill="#fff" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">(Teacher Output)</text><rect width="100" height="40" x="580" y="340" fill="#2c3e50" stroke="#34495e" stroke-width="1" rx="5"/><text x="630" y="355" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Combined Loss</text><text x="630" y="370" fill="#fff" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">α × Hard + β × Soft</text><path fill="none" stroke="#34495e" stroke-width="1" marker-end="url(#arrowhead-small)" d="M 575 325 L 620 340"/><path fill="none" stroke="#34495e" stroke-width="1" marker-end="url(#arrowhead-small)" d="M 675 325 L 640 340"/><path fill="none" stroke="#8e44ad" stroke-dasharray="5 5" stroke-width="3" marker-end="url(#arrowhead-purple)" d="M 380 200 Q 400 300 380 350"/><text x="420" y="275" fill="#8e44ad" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Knowledge</text><text x="420" y="290" fill="#8e44ad" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Transfer</text><path fill="none" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)" d="M 150 280 L 150 350"/><path fill="none" stroke="#e67e22" stroke-dasharray="3 3" stroke-width="2" marker-end="url(#arrowhead)" d="M 250 250 Q 400 250 520 290"/><text x="350" y="240" fill="#e67e22" font-family="Arial, sans-serif" font-size="10">Hard Targets</text><path fill="none" stroke="#1abc9c" stroke-dasharray="3 3" stroke-width="2" marker-end="url(#arrowhead)" d="M 460 160 Q 500 200 520 305"/><text x="500" y="150" fill="#1abc9c" font-family="Arial, sans-serif" font-size="10">Soft Targets</text><text x="380" y="220" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle">(with temperature scaling)</text><rect width="220" height="120" x="520" y="420" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="10"/><text x="630" y="445" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Benefits</text><text x="530" y="465" fill="#2c3e50" font-family="Arial, sans-serif" font-size="10">✓ Reduced model size (5-10x smaller)</text><text x="530" y="480" fill="#2c3e50" font-family="Arial, sans-serif" font-size="10">✓ Faster inference speed</text><text x="530" y="495" fill="#2c3e50" font-family="Arial, sans-serif" font-size="10">✓ Lower computational cost</text><text x="530" y="510" fill="#2c3e50" font-family="Arial, sans-serif" font-size="10">✓ Retains 80-95% of teacher performance</text><text x="530" y="525" fill="#2c3e50" font-family="Arial, sans-serif" font-size="10">✓ Suitable for edge deployment</text><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#34495e" points="0 0 10 3.5 0 7"/></marker><marker id="arrowhead-small" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#34495e" points="0 0 8 3 0 6"/></marker><marker id="arrowhead-purple" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#8e44ad" points="0 0 10 3.5 0 7"/></marker></defs></svg>