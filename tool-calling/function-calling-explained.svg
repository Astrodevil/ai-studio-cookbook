<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600"><defs><linearGradient id="userGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#4caf50;stop-opacity:1"/><stop offset="100%" style="stop-color:#2e7d32;stop-opacity:1"/></linearGradient><linearGradient id="llmGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#2196f3;stop-opacity:1"/><stop offset="100%" style="stop-color:#1565c0;stop-opacity:1"/></linearGradient><linearGradient id="functionGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#ff9800;stop-opacity:1"/><stop offset="100%" style="stop-color:#e65100;stop-opacity:1"/></linearGradient><linearGradient id="apiGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#9c27b0;stop-opacity:1"/><stop offset="100%" style="stop-color:#6a1b9a;stop-opacity:1"/></linearGradient><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#333" points="0 0 10 3.5 0 7"/></marker><filter id="dropshadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="3" dy="3" flood-color="#000" flood-opacity=".3" stdDeviation="3"/></filter></defs><rect width="1000" height="600" fill="#f8f9fa"/><text x="500" y="30" fill="#2c3e50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Function Calling in Large Language Models</text><g transform="translate(50, 80)"><rect width="150" height="80" x="0" y="0" fill="url(#userGradient)" filter="url(#dropshadow)" rx="10"/><text x="75" y="25" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">USER INPUT</text><text x="75" y="45" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">&quot;What&apos;s the weather</text><text x="75" y="58" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">in Tokyo today?&quot;</text></g><line x1="210" x2="270" y1="120" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/><text x="240" y="115" fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">1</text><g transform="translate(280, 80)"><rect width="150" height="80" x="0" y="0" fill="url(#llmGradient)" filter="url(#dropshadow)" rx="10"/><text x="75" y="25" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">LLM ANALYSIS</text><text x="75" y="45" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Identifies need for</text><text x="75" y="58" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">weather API call</text></g><line x1="440" x2="500" y1="120" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/><text x="470" y="115" fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">2</text><g transform="translate(510, 80)"><rect width="150" height="80" x="0" y="0" fill="url(#functionGradient)" filter="url(#dropshadow)" rx="10"/><text x="75" y="20" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">FUNCTION CALL</text><text x="75" y="38" fill="#fff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">get_weather({</text><text x="75" y="50" fill="#fff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">&quot;location&quot;: &quot;Tokyo&quot;</text><text x="75" y="62" fill="#fff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">})</text></g><line x1="670" x2="730" y1="120" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/><text x="700" y="115" fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">3</text><g transform="translate(740, 80)"><rect width="150" height="80" x="0" y="0" fill="url(#apiGradient)" filter="url(#dropshadow)" rx="10"/><text x="75" y="25" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">EXTERNAL API</text><text x="75" y="45" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Weather Service</text><text x="75" y="58" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Execution</text></g><line x1="730" x2="670" y1="180" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/><text x="700" y="175" fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">4</text><g transform="translate(510, 200)"><rect width="150" height="60" x="0" y="0" fill="#e8f5e8" stroke="#4CAF50" stroke-width="2" rx="10"/><text x="75" y="20" fill="#2E7D32" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">API RESPONSE</text><text x="75" y="35" fill="#2E7D32" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">{&quot;temp&quot;: 22°C,</text><text x="75" y="48" fill="#2E7D32" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">&quot;condition&quot;: &quot;sunny&quot;}</text></g><line x1="500" x2="440" y1="230" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/><text x="470" y="225" fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">5</text><g transform="translate(280, 200)"><rect width="150" height="60" x="0" y="0" fill="url(#llmGradient)" filter="url(#dropshadow)" rx="10"/><text x="75" y="18" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">RESPONSE GEN</text><text x="75" y="35" fill="#fff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">Synthesizes data into</text><text x="75" y="48" fill="#fff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">natural language</text></g><line x1="270" x2="210" y1="230" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/><text x="240" y="225" fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">6</text><g transform="translate(50, 200)"><rect width="150" height="60" x="0" y="0" fill="#e8f5e8" stroke="#4CAF50" stroke-width="2" rx="10"/><text x="75" y="18" fill="#2E7D32" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">FINAL RESPONSE</text><text x="75" y="35" fill="#2E7D32" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">&quot;It&apos;s currently 22°C</text><text x="75" y="48" fill="#2E7D32" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">and sunny in Tokyo&quot;</text></g><g transform="translate(50, 320)"><rect width="400" height="220" x="0" y="0" fill="#fff" stroke="#ddd" stroke-width="2" filter="url(#dropshadow)" rx="10"/><text x="200" y="25" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Function Schema Definition</text><rect width="360" height="160" x="20" y="40" fill="#2d3748" rx="5"/><text x="30" y="60" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11">{</text><text x="40" y="75" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11">&quot;name&quot;: &quot;get_weather&quot;,</text><text x="40" y="90" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11">&quot;description&quot;: &quot;Get current weather&quot;,</text><text x="40" y="105" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11">&quot;parameters&quot;: {</text><text x="60" y="120" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11">&quot;type&quot;: &quot;object&quot;,</text><text x="60" y="135" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11">&quot;properties&quot;: {</text><text x="80" y="150" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11">&quot;location&quot;: {</text><text x="100" y="165" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11">&quot;type&quot;: &quot;string&quot;</text><text x="80" y="180" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11">}</text><text x="60" y="195" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11">}</text><text x="40" y="210" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11">}</text><text x="30" y="225" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11">}</text></g><g transform="translate(500, 320)"><rect width="450" height="220" x="0" y="0" fill="#fff" stroke="#ddd" stroke-width="2" filter="url(#dropshadow)" rx="10"/><text x="225" y="25" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Key Benefits</text><circle cx="30" cy="55" r="5" fill="#4CAF50"/><text x="45" y="60" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Real-time Data Access</text><text x="45" y="75" fill="#666" font-family="Arial, sans-serif" font-size="10">Access current information beyond training data</text><circle cx="30" cy="95" r="5" fill="#2196F3"/><text x="45" y="100" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Action Capability</text><text x="45" y="115" fill="#666" font-family="Arial, sans-serif" font-size="10">Perform actions, not just generate text</text><circle cx="30" cy="135" r="5" fill="#FF9800"/><text x="45" y="140" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Extensibility</text><text x="45" y="155" fill="#666" font-family="Arial, sans-serif" font-size="10">Easy to add new capabilities</text><circle cx="30" cy="175" r="5" fill="#9C27B0"/><text x="45" y="180" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Structured Output</text><text x="45" y="195" fill="#666" font-family="Arial, sans-serif" font-size="10">Reliable JSON format for API interactions</text></g><g><text x="0" y="0" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" transform="translate(50, 570)">Process Flow:</text><text x="100" y="0" fill="#666" font-family="Arial, sans-serif" font-size="11" transform="translate(50, 570)">1. User Input → 2. LLM Analysis → 3. Function Call → 4. API Response → 5. Data Processing → 6. Natural Language Response</text></g></svg>